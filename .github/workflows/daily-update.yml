name: Daily data update

# Giờ Việt Nam = UTC + 7. GitHub có thể chạy trễ 5–30 phút so với lịch.
#   00:10 UTC (07:10)  bản sáng, lưu vào repo
#   00:40 UTC (07:40)  dự phòng cho bản sáng: tự bỏ qua nếu bản sáng đã chạy
#   */30 01-09 UTC     08:00–16:30 mỗi 30 phút: chỉ cập nhật website, KHÔNG lưu vào repo
#   10:00 UTC (17:00)  bản cuối ngày, lưu vào repo (là bản lưu của ngày đó khi chọn ngày cũ)
on:
  schedule:
    - cron: "10 0 * * *"
    - cron: "40 0 * * *"
    - cron: "*/30 1-9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Chạy lại kể cả khi hôm nay đã có dữ liệu"
        type: boolean
        default: false

concurrency:
  group: data-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      data_artifact: ${{ steps.commit.outputs.data_artifact }}
    steps:
      - name: Xác định loại lần chạy
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "*/30 1-9 * * *") echo "save=false" >> "$GITHUB_OUTPUT" ;;
            *)                echo "save=true"  >> "$GITHUB_OUTPUT" ;;
          esac
          case "${{ github.event.schedule }}" in
            "10 0 * * *") echo "scheduled=07:10" >> "$GITHUB_OUTPUT" ;;
            "40 0 * * *") echo "scheduled=07:40" >> "$GITHUB_OUTPUT"; echo "skip_if_done=1" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * *") echo "scheduled=17:00" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt
      - run: pip install -r requirements.txt
      # Mô hình chấm giọng tin là phần phụ: cài lỗi thì website chỉ ẩn dòng giọng tin
      - name: Cài mô hình chấm giọng tin
        continue-on-error: true
        run: pip install -r requirements-ml.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-fintwitbert-da059da
      - name: Thu thập & tính toán
        env:
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MI_SCHEDULED_FOR: ${{ steps.mode.outputs.scheduled }}
          MI_SKIP_IF_DONE: ${{ steps.mode.outputs.skip_if_done }}
        run: python -m scripts.run_pipeline ${{ inputs.force && '--force' || '' }}
      - name: Kiểm tra dữ liệu
        run: python -m scripts.validators.check_data public/data
      - name: Gói dữ liệu cho lần cập nhật trong ngày
        if: steps.mode.outputs.save == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: live-data
          path: public/data
          retention-days: 1
      - name: Commit dữ liệu
        id: commit
        run: |
          if [ "${{ steps.mode.outputs.save }}" = "false" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data_artifact=live-data" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "market-intel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "data: cập nhật $(TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%d %H:%M') (UTC+7)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      data_artifact: ${{ needs.collect.outputs.data_artifact }}
    permissions:
      contents: read
      pages: write
      id-token: write
