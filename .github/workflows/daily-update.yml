name: Daily data update

# 00:10 UTC = 07:10 sáng Việt Nam. GitHub có thể chạy trễ 5–30 phút nên đặt sớm
# để dữ liệu sẵn sàng quanh 07:30. Lịch thứ hai (00:40 UTC) là lần dự phòng: nếu lần
# đầu đã thành công, pipeline tự bỏ qua (không tạo bản trùng).
on:
  schedule:
    - cron: "10 0 * * *"
    - cron: "40 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Chạy lại kể cả khi hôm nay đã có dữ liệu"
        type: boolean
        default: false

concurrency:
  group: data-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Thu thập & tính toán
        env:
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m scripts.run_pipeline ${{ inputs.force && '--force' || '' }}
      - name: Kiểm tra dữ liệu
        run: python -m scripts.validators.check_data public/data
      - name: Commit dữ liệu
        id: commit
        run: |
          git config user.name "market-intel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "data: cập nhật $(TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%d %H:%M') (UTC+7)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
