name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: bash {0}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for u in "https://www.investing.com/currencies/usd-vnd" "https://api.investing.com/api/financialdata/1141/historical/chart/?interval=PT5M&pointscount=60" "https://uk.investing.com/currencies/usd-vnd"; do
            curl -sS -L -m 30 -A "$UA" -o /tmp/i.html -w "INVESTING http=%{http_code} size=%{size_download} $u\n" "$u"
            head -c 150 /tmp/i.html | tr '\n' ' '; echo
          done
          for s in "DX-Y.NYB" "%5ETNX" "USDVND=X"; do
            for h in query2 query1; do
              sleep 3
              c=$(curl -sS -m 40 -A "$UA" "https://$h.finance.yahoo.com/v8/finance/chart/$s?interval=5m&range=1d" -o /tmp/y.json -w "%{http_code}")
              echo "HTTP $h $s $c"
              if [ "$c" = "200" ]; then python3 -c "
          import json
          d=json.load(open('/tmp/y.json')); r=d['chart']['result'][0]
          t=r['timestamp']; cl=r['indicators']['quote'][0]['close']
          print('DATA|$s|'+json.dumps([[a,b] for a,b in zip(t,cl) if b is not None],separators=(',',':')))
          print('META|$s|',r['meta'].get('regularMarketPrice'),r['meta'].get('chartPreviousClose'))
          "; break; fi
            done
          done
