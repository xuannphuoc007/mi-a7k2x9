name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sS -L -m 40 -A "$UA" "https://sbv.gov.vn/vi/lãi-suất1" -o /tmp/ls.html
          curl -sS -L -m 40 -A "$UA" "https://sbv.gov.vn/vi/t%E1%BB%B7-gi%C3%A1" -o /tmp/tg.html
          curl -sS -L -m 40 -A "$UA" "https://stockbiz.vn/vi-mo/du-lieu/lai-suat-lien-ngan-hang" -o /tmp/sb.html
          python3 - <<'PY'
          import re,html
          def txt(p):
              s=open(p,encoding='utf-8',errors='ignore').read()
              s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>',' ',s)
              s=re.sub(r'(?s)<[^>]+>','\n',s)
              s=html.unescape(s)
              return re.sub(r'\n\s*\n+','\n',re.sub(r'[ \t]+',' ',s))
          for name,p,keys in (("LAI-SUAT","/tmp/ls.html",["iên ngân hàng"]),("TY-GIA","/tmp/tg.html",["rung tâm","iên ngân hàng"])):
              t=txt(p)
              print("=====",name,len(t))
              for k in keys:
                  for m in list(re.finditer(k,t))[:4]:
                      print("--",k,":",t[max(0,m.start()-300):m.start()+700].replace("\n"," | "))
          s=open('/tmp/sb.html',encoding='utf-8',errors='ignore').read()
          print("===== STOCKBIZ")
          i=s.find('04/11/2026'); print(i, s[max(0,i-300):i+500] if i>=0 else s[-1500:])
          for m in list(re.finditer(r'(?i)(https?:)?//[a-z0-9./_-]*api[a-z0-9./_?=&-]*',s))[:10]: print(m.group(0))
          PY
