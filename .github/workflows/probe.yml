name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sS -L -m 40 -A "$UA" -c /tmp/cj -b /tmp/cj -w "\nHTTP=%{http_code} URL=%{url_effective} SIZE=%{size_download}\n" "https://dttktt.sbv.gov.vn/webcenter/portal/vi/menu/rm/ls/lsttlnh" -o /tmp/d.html | tail -2
          python3 - <<'PY'
          import re,html
          s=open('/tmp/d.html',encoding='utf-8',errors='ignore').read()
          print("LEN",len(s))
          t=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>',' ',s); t=re.sub(r'(?s)<[^>]+>','\n',t); t=html.unescape(t)
          t=re.sub(r'\n\s*\n+','\n',re.sub(r'[ \t]+',' ',t))
          print("TEXT",t[:3500].replace("\n"," | "))
          for h in sorted(set(re.findall(r'href="([^"]*(?:menu/rm)[^"]*)"',s)))[:40]: print("HREF",h)
          print("RAW", s[:800])
          PY
