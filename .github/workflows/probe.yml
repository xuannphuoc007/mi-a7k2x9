name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for s in "USDVND=X" "DX-Y.NYB" "%5ETNX" "%5EFVX" "%5EIRX"; do
            curl -sS -m 40 -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/$s?interval=5m&range=5d" -o /tmp/y.json -w "HTTP $s %{http_code} %{size_download}\n"
            python3 -c "
          import json,sys
          d=json.load(open('/tmp/y.json'))
          r=(d['chart']['result'] or [None])[0]
          if not r: print('DATA|$s|ERR', d['chart'].get('error')); sys.exit()
          t=r['timestamp']; c=r['indicators']['quote'][0]['close']
          print('DATA|$s|'+json.dumps([[a,b] for a,b in zip(t,c) if b is not None],separators=(',',':')))
          print('META|$s|', json.dumps({k:r['meta'].get(k) for k in ('regularMarketPrice','chartPreviousClose','previousClose','exchangeName','instrumentType')}))
          "
          done
          for u in "https://www.investing.com/currencies/usd-vnd" "https://api.investing.com/api/financialdata/1141/historical/chart/?interval=PT5M&pointscount=60"; do
            curl -sS -L -m 30 -A "$UA" -o /tmp/i.html -w "INVESTING $u http=%{http_code} size=%{size_download}\n" "$u" || true
            head -c 200 /tmp/i.html | tr '\n' ' '; echo
          done
