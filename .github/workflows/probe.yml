name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sS -L -m 40 -A "$UA" "https://sbv.gov.vn/vi/t%E1%BB%B7-gi%C3%A1" -o /tmp/tg.html
          python3 - <<'PY'
          import re,html,subprocess
          s=open('/tmp/tg.html',encoding='utf-8',errors='ignore').read()
          links=re.findall(r'<a[^>]*href="([^"]+)"[^>]*>\s*([^<]*(?:liên ngân hàng|Lãi suất)[^<]*)',s)
          seen=set()
          for h,t in links:
              if (h,t.strip()) in seen: continue
              seen.add((h,t.strip())); print("LINK",h,"|",t.strip())
          def txt(s):
              s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>',' ',s)
              s=re.sub(r'(?s)<[^>]+>','\n',s); s=html.unescape(s)
              return re.sub(r'\n\s*\n+','\n',re.sub(r'[ \t]+',' ',s))
          for h,t in links:
              if 'thị trường liên ngân hàng' in t:
                  u=h if h.startswith('http') else 'https://sbv.gov.vn'+h
                  print("FETCH",u)
                  r=subprocess.run(['curl','-sS','-L','-m','40','-A','Mozilla/5.0',u],capture_output=True)
                  tt=txt(r.stdout.decode('utf-8','ignore'))
                  i=tt.find('Lãi suất thị trường liên ngân hàng',tt.find('Ngân hàng Nhà nước Việt Nam |'))
                  j=tt.rfind('Lãi suất thị trường liên ngân hàng')
                  print(len(tt)); print(tt[j-200:j+3500].replace("\n"," | "))
                  break
          PY
