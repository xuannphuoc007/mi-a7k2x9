name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(url, h):
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      b = r.read().decode()
                      print(r.status, b[:1500])
              except Exception as e:
                  print("ERR", e, getattr(e, 'read', lambda: b'')()[:300])
          H = {"Origin": "https://www.investing.com", "Referer": "https://www.investing.com/",
               "Accept": "application/json, text/plain, */*", "domain-id": "1",
               "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"}
          get("https://endpoints.investing.com/pd-instruments/v1/instruments/2214?domain_id=1", H)
          get("https://endpoints.investing.com/pd-instruments/v1/instruments/2214?domain_id=1", {"Accept":"application/json"})
          PY
